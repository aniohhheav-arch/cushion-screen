// Native FFmpeg builds bundled into the jars. Default: all desktop platforms.
// Slim build for one platform:  ./gradlew build -Pnatives=windows-x86_64
ext.nativePlatforms = (project.findProperty('natives') ?: 'windows-x86_64,linux-x86_64,macosx-x86_64,macosx-arm64')
    .toString().split(',').collect { it.trim() }.findAll { it }

subprojects {
    apply plugin: 'java'
    group = rootProject.group
    version = rootProject.mod_version
    base { archivesName = "${rootProject.mod_id}-${project.name}-${rootProject.minecraft_version}" }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }
    repositories {
        // Loader artifacts only come from their own repositories (avoids asking Maven Central for them).
        exclusiveContent {
            forRepositories(
                maven { url = 'https://maven.neoforged.net/releases' },
                maven { url = 'https://maven.neoforged.net/mojang-meta' })
            filter { includeGroupByRegex 'net\\.neoforged(\\..*)?'; includeGroup 'cpw.mods' }
        }
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
}
